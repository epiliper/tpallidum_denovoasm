repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-tpallidum-denovoasm_logo_light.png
    - docs/images/nf-core-tpallidum-denovoasm_logo_light.png
    - docs/images/nf-core-tpallidum-denovoasm_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - LICENSE
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - .github/.dockstore.yml
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-tpallidum-denovoasm_logo_light.png
    - docs/images/nf-core-tpallidum-denovoasm_logo_light.png
    - docs/images/nf-core-tpallidum-denovoasm_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - LICENSE
    - CHANGELOG.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/.dockstore.yml
    - docs/CONTRIBUTING.md
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  readme:
    - nextflow_badge
    - nextflow_badge
    - nfcore_template_badge

template:
  org: greninger-lab
  name: tpallidum-denovoasm
  description: De novo assembly of Treponema pallidum
  author: Eli Piliper, Nicole Lieberman
  version: 0.1.0
  force: true
  outdir: .
  skip_features:
    - github
    - github_badges
    - changelog
    - license
    - igenomes
    - gpu
  is_nfcore: false
